<svg viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Frostburn — HVAC Software</title>
  <desc>Frostburn primary horizontal logo on dark background</desc>

  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;display=swap');</style>

    <linearGradient id="badgeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1530"/>
      <stop offset="100%" stop-color="#05091A"/>
    </linearGradient>

    <filter id="iceGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Reusable single arm: main line + 2 cross branches -->
    <g id="arm">
      <line x1="0" y1="0" x2="0" y2="-37" stroke-width="3.5"/>
      <line x1="-12" y1="-19" x2="12" y2="-19" stroke-width="2.5"/>
      <line x1="-7" y1="-29" x2="7" y2="-29" stroke-width="2"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="500" height="120" fill="#05091A"/>

  <!-- Badge shell -->
  <rect x="4" y="4" width="112" height="112" rx="22" fill="url(#badgeFill)"/>
  <!-- Outer border -->
  <rect x="4" y="4" width="112" height="112" rx="22" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.55"/>
  <!-- Inner inset ring -->
  <rect x="7" y="7" width="106" height="106" rx="19" fill="none" stroke="#38BDF8" stroke-width="0.4" opacity="0.18"/>

  <!-- 6-arm geometric snowflake -->
  <g transform="translate(60,60)" stroke="#38BDF8" stroke-linecap="round" fill="none" filter="url(#iceGlow)">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
    <!-- Amber core: frost meets fire -->
    <circle r="5.5" fill="#F59E0B" stroke="none"/>
  </g>

  <!-- Wordmark: FROST in white, BURN in amber -->
  <text x="130" y="79"
    font-family="'Bebas Neue', 'Arial Black', Impact, sans-serif"
    font-size="66"
    letter-spacing="2">
    <tspan fill="#FFFFFF">FROST</tspan><tspan fill="#F59E0B">BURN</tspan>
  </text>
</svg>
