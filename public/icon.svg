<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Frostburn Icon Mark</title>
  <desc>Frostburn badge icon — for favicons, app icons, avatars, embroidery</desc>

  <defs>
    <linearGradient id="badgeFillI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1530"/>
      <stop offset="100%" stop-color="#05091A"/>
    </linearGradient>

    <filter id="iceGlowI" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="armI">
      <line x1="0" y1="0" x2="0" y2="-37" stroke-width="3.5"/>
      <line x1="-12" y1="-19" x2="12" y2="-19" stroke-width="2.5"/>
      <line x1="-7" y1="-29" x2="7" y2="-29" stroke-width="2"/>
    </g>
  </defs>

  <!-- Badge shell -->
  <rect x="4" y="4" width="112" height="112" rx="22" fill="url(#badgeFillI)"/>
  <rect x="4" y="4" width="112" height="112" rx="22" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.55"/>
  <rect x="7" y="7" width="106" height="106" rx="19" fill="none" stroke="#38BDF8" stroke-width="0.4" opacity="0.18"/>

  <!-- Snowflake -->
  <g transform="translate(60,60)" stroke="#38BDF8" stroke-linecap="round" fill="none" filter="url(#iceGlowI)">
    <use href="#armI"/>
    <use href="#armI" transform="rotate(60)"/>
    <use href="#armI" transform="rotate(120)"/>
    <use href="#armI" transform="rotate(180)"/>
    <use href="#armI" transform="rotate(240)"/>
    <use href="#armI" transform="rotate(300)"/>
    <circle r="5.5" fill="#F59E0B" stroke="none"/>
  </g>
</svg>
